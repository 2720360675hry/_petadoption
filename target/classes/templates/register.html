<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>
<head>
    <meta charset="UTF-8">
    <title>register</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <script src="/js/jquery.min.js"></script>
  <script src="/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" type="text/css" href="/css/login.css"/>
</head>
<body style="background-color:#F9F9F0;">
<!--注册页面-->
<div class="control">
<div class="item">
 <div>Sign Up</div>
</div>

<div class="content">
 <div>
  <form method="post" th:action="@{/register}">

    <input type="text" name="Name" placeholder="用户名" required="required"/>
    <input type="text" name="Account" placeholder="账号" required="required"/>
    <input type="password" name="Password" placeholder="密码" required="required"/>
    <br/>
    <input type="submit" value="注册并登录"/>
  </form>
 </div>
</div>

<!--    当登录的账号不存在，就会显示   用户不存在-->
<div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
  <span th:text="${error}"></span>
  <button type="button" class="close" data-dismiss="alert" aria-label="Close">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
</div>

</body>
</html>
