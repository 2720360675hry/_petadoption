<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物喜好选择器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .selected-image {
            border: 4px solid #8b5cf6;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
            transform: scale(1.05);
        }

        .progress-bar {
            height: 6px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pet-image {
            transition: all 0.3s ease;
            object-fit: cover;
        }

        .pet-image:hover {
            transform: scale(1.05);
            cursor: pointer;
        }

        .comparison-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .image-wrapper {
            position: relative;
            text-align: center;
        }

        .image-label {
            position: absolute;
            bottom: -25px;
            left: 0;
            right: 0;
            text-align: center;
            font-weight: bold;
            color: #4b5563;
        }
    </style>
</head>

<body class="py-8">
<div class="max-w-3xl mx-auto px-4">
    <!-- 进度指示器 -->
    <div class="mb-8">
        <div class="flex justify-between mb-2">
            <span class="text-sm font-medium">选择宠物</span>
            <span class="text-sm font-medium">完成选择</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2.5">
            <div id="progressBar" class="progress-bar rounded-full" style="width: 33%"></div>
        </div>
    </div>

    <!-- 第一步：选择猫或狗 -->
    <div id="step1" class="card p-8 fade-in">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">
            <i class="fas fa-paw mr-3"></i>你喜欢猫还是狗？
        </h1>
        <p class="text-center text-gray-600 mb-8">请选择你更喜欢的宠物类型</p>
        <div class="flex flex-col sm:flex-row justify-center gap-6">
            <button onclick="nextStep('猫')" class="btn-primary py-4 px-8 rounded-full text-lg flex flex-col items-center">
                <i class="fas fa-cat text-3xl mb-2"></i>
                <span>猫咪</span>
            </button>
            <button onclick="nextStep('狗')" class="btn-secondary py-4 px-8 rounded-full text-lg flex flex-col items-center">
                <i class="fas fa-dog text-3xl mb-2"></i>
                <span>狗狗</span>
            </button>
        </div>
    </div>

    <!-- 第二步：选择具体宠物类型 -->
    <div id="step2" class="card p-8 fade-in hidden">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">
            <i class="fas fa-list-ul mr-3"></i>选择具体品种
        </h1>
        <p class="text-center text-gray-600 mb-8">请选择你喜欢的宠物品种</p>
        <div id="typeOptions" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        <button onclick="goBack(1)" class="mt-6 text-purple-600 hover:text-purple-800 transition">
            <i class="fas fa-arrow-left mr-2"></i>上一步
        </button>
    </div>

    <!-- 第三步：图片比较选择 -->
    <div id="step3" class="card p-8 fade-in hidden">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">
            <i class="fas fa-images mr-3"></i>请选择你更喜欢的图片
        </h1>
        <p class="text-center text-gray-600 mb-8">点击你更喜欢的图片</p>

        <div id="comparisonContainer" class="comparison-container">
            <!-- 图片比较区域，动态生成 -->
        </div>

        <div class="flex justify-between mt-12">
            <button onclick="goBack(2)" class="text-purple-600 hover:text-purple-800 transition">
                <i class="fas fa-arrow-left mr-2"></i>上一步
            </button>
            <div id="roundInfo" class="text-center text-gray-600">
                第 <span id="currentRound">1</span>/<span id="totalRounds">5</span> 轮比较
            </div>
            <button id="nextBtn" onclick="nextComparison()" class="btn-primary py-3 px-8 rounded-full text-lg flex items-center">
                <i class="fas fa-arrow-right mr-2"></i>下一组
            </button>
            <button id="submitBtn" onclick="submitPreference()"
                    class="btn-primary py-3 px-8 rounded-full text-lg flex items-center hidden">
                <i class="fas fa-check-circle mr-2"></i>完成选择
            </button>
        </div>
    </div>
</div>

<script>
    const petTypes = {
        '猫': [
            { name: '奶牛猫', icon: 'fa-cat' },
            { name: '橘猫', icon: 'fa-sun' },
            { name: '狸猫', icon: 'fa-paw' }
        ],
        '狗': [
            { name: '哈士奇', icon: 'fa-snowflake' },
            { name: '金毛', icon: 'fa-mountain' },
            { name: '边牧', icon: 'fa-dog' }
        ]
    };

    const petImages = {
        '猫': {
            '奶牛猫': [
                '/img/slider/nainiumao.jpg',
                '/img/slider/3.webp',
                '/img/slider/5.jpg',
                '/img/slider/9.webp',
                '/img/slider/5.jpg',
                '/img/slider/3.jpg'
            ],
            '橘猫': [
                '/img/slider/橘猫.jpg',
                '/img/slider/橘猫1.jpg',
                '/img/slider/橘猫2.jpg',
                '/img/slider/橘猫3.jpg',
                '/img/slider/cat1.jpg',
                '/img/slider/gaodi1.jpg'
            ],
            '狸猫': [
                '/img/slider/狸猫.jpg',
                '/img/slider/狸猫1.jpg',
                '/img/slider/狸猫2.jpg',
                '/img/slider/狸猫3.jpg',
                '/img/slider/狸猫4.jpg',
                '/img/slider/lihuamao.jpg'
            ]
        },
        '狗': {
            '哈士奇': [
                '/img/slider/哈士奇.jpg',
                '/img/slider/哈士奇1.jpg',
                '/img/slider/哈士奇2.jpg',
                '/img/slider/hashiqi.jpg',
                '/img/slider/阿拉斯加1.jpg',
                '/img/slider/哈士奇.jpg'
            ],
            '金毛': [
                '/img/slider/4.webp',
                '/img/slider/金毛.jpg',
                '/img/slider/金毛1.jpg',
                '/img/slider/中华田园犬1.jpg',
                '/img/slider/中华田园犬2.jpg',
                '/img/slider/中华田园犬.jpg'
            ],
            '边牧': [
                '/img/slider/bianmu1.jpg',
                '/img/slider/bianmu2.jpg',
                '/img/slider/dog1.jpg',
                '/img/slider/songshiquan.jpg',
                '/img/slider/边牧.jpg',
                '/img/slider/柴犬.jpg'
            ]
        }
    };

    let selectedPetSub;
    let selectedPetType;
    let selectedImages = [];
    let currentComparisonIndex = 0;
    let allImages = [];
    let totalComparisons = 0;
    let currentSelectedImage = null;

    function updateProgress(step) {
        const progress = step * 33;
        document.getElementById('progressBar').style.width = `${progress}%`;
    }

    function nextStep(petSub) {
        selectedPetSub = petSub;
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        updateProgress(2);

        const typeOptions = document.getElementById('typeOptions');
        typeOptions.innerHTML = '';

        petTypes[petSub].forEach(type => {
            const button = document.createElement('button');
            button.innerHTML = `
                <div class="card p-6 text-center hover:bg-purple-50 transition">
                    <i class="fas ${type.icon} text-4xl mb-3 text-purple-600"></i>
                    <h3 class="text-xl font-semibold">${type.name}</h3>
                </div>
            `;
            button.classList.add('transition', 'transform', 'hover:-translate-y-1');
            button.onclick = () => showComparison(type.name);
            typeOptions.appendChild(button);
        });
    }

    function showComparison(petType) {
        selectedPetType = petType;
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step3').classList.remove('hidden');
        updateProgress(3);

        // 重置选择状态
        selectedImages = [];
        currentComparisonIndex = 0;
        allImages = petImages[selectedPetSub][selectedPetType];

        // 计算总比较轮次 (n-1轮，n为图片数量)
        totalComparisons = allImages.length - 1;
        document.getElementById('totalRounds').textContent = totalComparisons;

        loadComparison();
    }

    function loadComparison() {
        const comparisonContainer = document.getElementById('comparisonContainer');
        comparisonContainer.innerHTML = '';

        // 更新当前轮次显示
        document.getElementById('currentRound').textContent = currentComparisonIndex + 1;

        // 如果是最后一轮，显示提交按钮
        if (currentComparisonIndex >= totalComparisons - 1) {
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('submitBtn').classList.remove('hidden');
        } else {
            document.getElementById('nextBtn').classList.remove('hidden');
            document.getElementById('submitBtn').classList.add('hidden');
        }

        // 获取当前要比较的两张图片
        const image1 = currentSelectedImage || allImages[currentComparisonIndex];
        const image2 = allImages[currentComparisonIndex + 1];

        // 创建图片比较界面
        comparisonContainer.innerHTML = `
            <div class="image-wrapper">
                <img src="${image1}" alt="图片1" class="pet-image w-64 h-64 rounded-xl"
                     onclick="selectImage(this, '${image1}')">
<!--                <div class="image-label">图片A</div>-->
            </div>
<!--            <div class="text-center self-center font-bold text-gray-600">VS</div>-->
            <div class="image-wrapper">
                <img src="${image2}" alt="图片2" class="pet-image w-64 h-64 rounded-xl"
                     onclick="selectImage(this, '${image2}')">
<!--                <div class="image-label">图片B</div>-->
            </div>
        `;
    }

    function selectImage(imgElement, imageUrl) {
        // 移除之前的选择
        document.querySelectorAll('.pet-image').forEach(img => {
            img.classList.remove('selected-image');
        });

        // 标记当前选择
        imgElement.classList.add('selected-image');
        currentSelectedImage = imageUrl;
    }

    function nextComparison() {
        if (!currentSelectedImage) {
            alert('请先选择一张图片');
            return;
        }

        // 保存选择的图片
        selectedImages.push(currentSelectedImage);

        // 进入下一轮比较
        currentComparisonIndex++;
        loadComparison();
    }

    function goBack(step) {
        if (step === 1) {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
            updateProgress(1);
        } else if (step === 2) {
            if (currentComparisonIndex > 0) {
                // 如果在比较步骤中，返回上一轮比较
                currentComparisonIndex--;
                selectedImages.pop();
                currentSelectedImage = selectedImages[selectedImages.length - 1] || null;
                loadComparison();
            } else {
                // 如果已经在第一轮比较，返回品种选择
                document.getElementById('step3').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                updateProgress(2);
            }
        }
    }

    function submitPreference() {
        if (!currentSelectedImage) {
            alert('请先选择一张图片');
            return;
        }

        // 保存最后一次选择的图片
        selectedImages.push(currentSelectedImage);

        //添加内容
        // 假设用户 ID 是一个固定值，实际应用中需要从登录信息中获取
        const userId = '123';

        // 调用后端接口保存偏好信息
        const url = '/recommendation/preference';
        const data = {
            userId: userId,
            petSub: selectedPetSub,
            petType: selectedPetType
        };

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams(data)
        })
            .then(response => response.text())
            .then(result => {
                console.log(result);
                // 创建漂亮的确认弹窗
                const confirmation = `
                    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                        <div class="card p-8 max-w-md text-center">
                            <i class="fas fa-check-circle text-5xl text-green-500 mb-4"></i>
                            <h2 class="text-2xl font-bold mb-2">选择完成!</h2>
                            <div class="mb-6">
                                <h3 class="font-semibold mb-2">你最终选择的图片:</h3>
                                <img src="${currentSelectedImage}" alt="已选图片" class="w-full h-64 object-cover rounded-lg mt-2">
                            </div>
                            <button onclick="closeConfirmation()" class="btn-primary py-2 px-6 rounded-full">
                                确定
                            </button>
                        </div>
                    </div>
                `;

                const div = document.createElement('div');
                div.id = 'confirmationModal';
                div.innerHTML = confirmation;
                document.body.appendChild(div);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('保存偏好信息时出现错误，请稍后重试。');
            });

        // // 创建漂亮的确认弹窗
        // const confirmation = `
        //     <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        //         <div class="card p-8 max-w-md text-center">
        //             <i class="fas fa-check-circle text-5xl text-green-500 mb-4"></i>
        //             <h2 class="text-2xl font-bold mb-2">选择完成!</h2>
        //             <div class="mb-6">
        //                 <h3 class="font-semibold mb-2">你最终选择的图片:</h3>
        //                 <img src="${currentSelectedImage}" alt="已选图片" class="w-full h-64 object-cover rounded-lg mt-2">
        //             </div>
        //             <button onclick="closeConfirmation()" class="btn-primary py-2 px-6 rounded-full">
        //                 确定
        //             </button>
        //         </div>
        //     </div>
        // `;
        //
        // const div = document.createElement('div');
        // div.id = 'confirmationModal';
        // div.innerHTML = confirmation;
        // document.body.appendChild(div);
    }

    function closeConfirmation() {
        const modal = document.getElementById('confirmationModal');
        if (modal) {
            modal.remove();
            // 跳转到首页
            window.location.href = 'index';
        }
    }
</script>
</body>
</html>
