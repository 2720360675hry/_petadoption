<body style="background-color:#F9F9F0;">
<!--登录页面-->
<div class="control">
    <div class="item">
        <div class="active">LOGIN</div>
    </div>
    <div class="content">
        <div >
            <form method="post" th:action="@{/login}">
                <input type="text" name="Account" placeholder="账号" required="required"/>
                <input type="password" name="Password" placeholder="密码" required="required"/>
                <br/>

                <span class="role">
					<input type="radio" id="user" name="role" value="用户" checked="checked"/>
					<label for="user">用户</label>
					<input type="radio" id="admin" name="role" value="管理员"/>
					<label for="admin">管理员</label>
                </span>
                <input type="submit" value="登录"/>

            </form>
        </div>

<!--这里需要注意，不能直接跳转到一个html，要通过写后端来跳转，这跟整个项目的访问有关，否则全部出问题-->
        <div class="noaccount"><a href="/register">还没有账号？<span class="zhuce">Sign Up</span></a></div>


    </div>
    <!--    当登录的账号不存在，就会显示   用户不存在-->
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
        <span th:text="${error}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
</div>
</body>
